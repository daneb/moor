[package]
name = "moor"
version = "0.5.3"
edition = "2021"
description = "Build software with an AI agent inside a locked-down container"
license = "MIT"
repository = "https://github.com/daneb/moor"

[[bin]]
name = "moor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
# Raw-mode keypresses and terminal setup/teardown for `moor studio`. The
# only thing taken on for it: rendering stays hand-rolled ANSI, the same
# call `commands/view.rs` made for markdown highlighting.
crossterm = "0.29"

[profile.release]
opt-level = 2
