# keel configuration — schema keel.config/1
# Budgets are enforced, not advised. Lower them until they hurt.
#
# build/test/lint go under [verify] — they are what G2 runs.
# [gate] is for extra checks of your own ([[gate.check]]).
# [oracle] is how a spec's `oracle: test` lines are executed.

schema = "keel.config/1"
shared = []

[map]
budget_lines = 400
codemap_budget_lines = 150
max_file_bytes = 1048576
codemap_min_files = 2
exclude = []

[store]
steering_budget_lines = 150

[[adapter]]
id = "claude"
out = "CLAUDE.md"
budget = 180
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "agents"
out = "AGENTS.md"
budget = 180
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "kiro"
out = ".kiro/steering/keel.md"
budget = 200
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "copilot"
out = ".github/copilot-instructions.md"
budget = 120
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[spec]
max_criteria = 12
max_lines = 250
max_ambiguities = 0

[plan]
blast_depth = 2
max_task_lines = 150
max_tasks = 15
max_reviewable_lines = 600

[gate]

[[driver]]
id = "claude-code"
cmd = ".keel/drivers/claude-code"
default = true
timeout_secs = 900

[verify]
build = "cargo build --quiet --manifest-path cli/Cargo.toml && cargo build --quiet --manifest-path mcp/Cargo.toml"
test = "cargo test --quiet --manifest-path cli/Cargo.toml && cargo test --quiet --manifest-path mcp/Cargo.toml"
lint = "cargo clippy --all-targets --quiet --manifest-path cli/Cargo.toml && cargo clippy --all-targets --quiet --manifest-path mcp/Cargo.toml"

[oracle]
test_cmd = ""
doctest_cmd = ""

[learn]
max_unattributable_rate = 0.5

[retrieve]
query_tokens = 2000
slice_tokens = 6000
max_unjustified_lines = 300

[[ratchet]]
id = "todo-markers"
cmd = "git grep -cE 'TODO|FIXME' -- . 2>/dev/null | awk -F: '{s+=$2} END {print s+0}'"
direction = "down"

[[driver]]
id = "codex"
cmd = ".keel/drivers/codex"
default = false
timeout_secs = 900

[[driver]]
id = "copilot"
cmd = ".keel/drivers/copilot"
default = false
timeout_secs = 900

[[driver]]
id = "kiro"
cmd = ".keel/drivers/kiro"
default = false
timeout_secs = 900

[[driver]]
id = "noop"
cmd = ".keel/drivers/noop"
default = false
timeout_secs = 30
