[package]
name = "moor-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server letting an agent inside a moor sandbox run checks and ask what is next"
license = "MIT"
repository = "https://github.com/daneb/moor"

[[bin]]
name = "moor-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
